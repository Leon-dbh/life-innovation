name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: node syntax check
        run: npm run check
      - name: unit tests
        run: npm test
      - name: package smoke
        run: npm run smoke
      - name: PowerShell BOM/parser check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-powershell.ps1
